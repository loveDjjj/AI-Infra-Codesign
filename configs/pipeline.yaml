{
  "schema_version": 1,
  "out": "workspace/pipeline/closed-loop-result-ai",
  "search_configs": [],
  "watch": [],
  "stay_open": true,
  "stop_on_exhaustion": true,
  "auto_audit": true,
  "scheduler": {
    "workers": 56,
    "full_slots": 2,
    "memory_fraction": 0.75,
