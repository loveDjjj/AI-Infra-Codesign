    "min_predicted_gain": 0,
    "max_pending": 3
  },
  "ai": {
    "enabled": true,
    "mode": "global",
    "timeout_seconds": 600,
    "model": "gpt-6-astra",
    "reasoning_effort": "medium"
  },
  "triggers": {
    "batch_size": 8,
    "cooldown_seconds": 120,
    "low_watermark": 8,
    "stagnation_trials": 12,
    "improvement_threshold": 0.002,
    "failure_window": 6,
    "failure_threshold": 5
  }
}
